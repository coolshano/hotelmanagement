services:

  redis:
    image: redis:7-alpine
    container_name: hotel_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ../hotelmanagement
    image: hotel-management-api:local
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/hotel.db
      REDIS_URL: redis://redis:6379/0
      HMS_SECRET_KEY: local-compose-secret-change-before-deployment
      HMS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - hotel-data:/data
    depends_on:
      - redis
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health',
          timeout=2
          )
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ../hotel_management_webapp
    image: hotel-management-frontend:local
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hotel-data: